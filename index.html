<!DOCTYPE html>
<html>
<head>
    <title>SilentAuth Enrollment</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background: gray;
        }

        #log {
            margin-top: 20px;
            height: 300px;
            overflow-y: auto;
            background: #111;
            color: #00ff88;
            padding: 10px;
            font-family: monospace;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Enrollment</h2>

    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username">

    <label>Preset</label>
    <select id="preset" onchange="handlePresetChange()">
        <option value="normal">Normal</option>
        <option value="voice_impaired">Voice Impaired</option>
        <option value="motor_impaired">Motor Impaired</option>
    </select>

    <label>Gesture</label>
    <select id="gesture"></select>

    <button id="startBtn" onclick="startEnrollment()">Start Enrollment</button>

    <div id="log"></div>
</div>

<script>

const GESTURES = [
    "bang", "comehere", "fist", "four", "grab", "greeting",
    "loser", "love", "ok", "palm", "pinkyfinger",
    "pointingfinger", "rock", "three", "thumbsup",
    "thumbsdown", "victory", "w", "zero"
]

function loadGestures() {
    const gestureDropdown = document.getElementById("gesture");
    gestureDropdown.innerHTML = "";

    GESTURES.forEach(gesture => {
        const option = document.createElement("option");
        option.value = gesture;
        option.textContent = gesture.replaceAll("_", " ");
        gestureDropdown.appendChild(option);
    });
}

window.onload = loadGestures;

function handlePresetChange() {
    const preset = document.getElementById("preset").value;
    const gestureDropdown = document.getElementById("gesture");

    if (preset === "motor_impaired") {
        gestureDropdown.disabled = true;
    } else {
        gestureDropdown.disabled = false;
    }
}

async function startEnrollment() {

    const username = document.getElementById("username").value.trim();
    const preset = document.getElementById("preset").value;
    const gesture = document.getElementById("gesture").value;
    const log = document.getElementById("log");
    const button = document.getElementById("startBtn");

    if (!username) {
        alert("Username required");
        return;
    }

    log.innerHTML = "";
    button.disabled = true;
    button.innerText = "Enrolling...";

    try {
        const response = await fetch("http://127.0.0.1:8003/enroll_stream", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_name: username,
                preset: preset,
                gesture_name: gesture
            })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            let parts = buffer.split("\n\n");

            // Keep last partial chunk in buffer
            buffer = parts.pop();

            for (let part of parts) {
                if (part.startsWith("data:")) {
                    const clean = part.replace("data:", "").trim();
                    log.innerHTML += clean + "<br>";
                    log.scrollTop = log.scrollHeight;
                }
            }
        }


    } catch (error) {
        log.innerHTML += "Error: " + error + "<br>";
    }

    button.disabled = false;
    button.innerText = "Start Enrollment";
}

</script>

</body>
</html>
